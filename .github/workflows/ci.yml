name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: eye-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check /health
        run: |
          docker run -d --name app -p 7860:7860 eye-detection:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Container did not become healthy in time"
          docker logs app
          exit 1

      - name: Show image size
        if: always()
        run: docker images eye-detection:ci
